name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test

      - name: Build workspace
        run: NODE_ENV=production pnpm -r build

  package:
    name: Package workspace artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: NODE_ENV=production pnpm -r build

      - name: Pack plugin artifact
        run: |
          mkdir -p artifacts/packages
          pnpm --dir packages/client pack --pack-destination "$GITHUB_WORKSPACE/artifacts/packages"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-loom-${{ github.sha }}
          path: artifacts/packages/**/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Package web dashboard
        run: |
          mkdir -p artifacts/web
          tar -czf "$GITHUB_WORKSPACE/artifacts/web/loom-web-${GITHUB_SHA}.tar.gz" -C apps/web/dist .

      - name: Upload web dashboard
        uses: actions/upload-artifact@v4
        with:
          name: loom-web-${{ github.sha }}
          path: artifacts/web/loom-web-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
