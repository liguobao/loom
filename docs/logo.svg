<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" role="img" aria-labelledby="title">
  <title id="title">Loom for DeepSeek Harness</title>
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="loom-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="loom-grad-teal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="loom-grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 700; font-size: 46px; letter-spacing: -0.5px; }
    .brand-subtitle { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-weight: 500; font-size: 19px; letter-spacing: 0.2px; }
    .node-center { fill: #ffffff; }

    @media (prefers-color-scheme: dark) {
      .brand-title { fill: #f8fafc; }
      .brand-subtitle { fill: #94a3b8; }
      .node-center { fill: #0f172a; }
    }
  </style>

  <!-- Loom Emblem (Weaving Threads & Project Memory Lens) -->
  <g transform="translate(24, 18)">
    <!-- Base Glow Rings -->
    <circle cx="42" cy="42" r="39" fill="none" stroke="url(#loom-grad-primary)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 3" />
    
    <!-- Woven Warp & Weft Threads (Symbolizing 'Loom') -->
    <!-- Thread 1: Teal to Blue Horizon Arc -->
    <path d="M 12 50 C 22 20, 62 20, 72 50 C 62 80, 22 80, 12 50 Z" 
          fill="none" 
          stroke="url(#loom-grad-teal)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Thread 2: Indigo to Blue Vertical Arc -->
    <path d="M 50 12 C 80 22, 80 62, 50 72 C 20 62, 20 22, 50 12 Z" 
          fill="none" 
          stroke="url(#loom-grad-indigo)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Intersecting Warp / Weft Wave -->
    <path d="M 18 24 Q 42 42, 66 60" 
          fill="none" 
          stroke="url(#loom-grad-primary)" 
          stroke-width="3" 
          stroke-linecap="round" />
    <path d="M 66 24 Q 42 42, 18 60" 
          fill="none" 
          stroke="#38bdf8" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-dasharray="7 4" />

    <!-- Central Memory Core Node -->
    <circle cx="42" cy="42" r="7.5" fill="url(#loom-grad-primary)" filter="url(#subtle-glow)" />
    <circle cx="42" cy="42" r="3.5" class="node-center" />
    
    <!-- Satellite Nodes (Active Work & Records) -->
    <circle cx="21" cy="42" r="2.8" fill="#06b6d4" />
    <circle cx="63" cy="42" r="2.8" fill="#6366f1" />
    <circle cx="42" cy="21" r="2.8" fill="#3b82f6" />
    <circle cx="42" cy="63" r="2.8" fill="#38bdf8" />
  </g>

  <!-- Wordmark -->
  <text class="brand-title" x="128" y="65">Loom</text>
  <text class="brand-subtitle" x="130" y="93">Keep the work, not the chat.</text>
</svg>
